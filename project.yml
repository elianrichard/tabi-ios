name: Tabi Split
configs:
  Debug-Dev: debug
  Debug-Staging: debug
  Debug-Production: debug
  Release-Dev: release
  Release-Staging: release
  Release-Production: release
settings:
  MARKETING_VERSION: "1.2.1"
  CURRENT_PROJECT_VERSION: 1
  base:
    GENERATE_INFOPLIST_FILE: YES
options:
  bundleIdPrefix: com.sora
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    minorVersion: 4.5.0
  JWTDecode:
    url: https://github.com/auth0/JWTDecode.swift.git
    minorVersion: 3.2.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    minorVersion: 8.0.0
targets:
  Tabi Split:
    type: application
    platform: iOS
    sources:
      - "Tabi Split"
      - "Shared"
    resources: [Resources]
    files:
      - path: "Tabi Split.app"
        type: wrapper.application
        buildPhase: none
    configFiles:
      Debug-Dev: Config/Dev.xcconfig
      Release-Dev: Config/Dev.xcconfig
      Debug-Staging: Config/Staging.xcconfig
      Release-Staging: Config/Staging.xcconfig
      Debug-Production: Config/Production.xcconfig
      Release-Production: Config/Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sora.TabiSplit
        INFOPLIST_FILE: Tabi Split/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        # BASE_URL is defined per-config in the xcconfig and surfaced to runtime
        # via the BASE_URL key in the explicit Info.plist ($(BASE_URL)).
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_ASSET_PATHS: '"Tabi Split/Resources/Preview Content"'
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          ["UIInterfaceOrientationPortrait"]
        IPHONEOS_DEPLOYMENT_TARGET: "18.1"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        INFOPLIST_KEY_CFBundleDisplayName: "Tabi"
        ENABLE_TESTABILITY: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Debug-Dev:
          ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        Debug-Staging:
          ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        Debug-Production:
          ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        Release-Dev:
          ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        Release-Staging:
          ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        Release-Production:
          ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    dependencies:
      - package: Lottie
      - package: JWTDecode
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: ShareExtension
        embed: true
    preBuildScripts:
      - name: Check required build settings
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          # A Production build with an empty API secret used to crash at the first
          # request (ENV.swift). Fail the build instead. Values come from Config/*.xcconfig;
          # the production secret from the gitignored Config/Secrets.xcconfig.
          if [ -z "${BASE_URL}" ]; then
            echo "error: BASE_URL is empty for ${CONFIGURATION}. Check Config/*.xcconfig."
            exit 1
          fi
          case "${CONFIGURATION}" in
            *Production*)
              if [ -z "${API_SECRET_KEY}" ]; then
                echo "error: API_SECRET_KEY is empty for ${CONFIGURATION}. Create Config/Secrets.xcconfig from Config/Secrets.xcconfig.example (locally) or set the PROD_API_SECRET_KEY secret (Xcode Cloud)."
                exit 1
              fi
              ;;
          esac
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - "ShareExtension"
      - "Shared"
    configFiles:
      Debug-Dev: Config/Dev.xcconfig
      Release-Dev: Config/Dev.xcconfig
      Debug-Staging: Config/Staging.xcconfig
      Release-Staging: Config/Staging.xcconfig
      Debug-Production: Config/Production.xcconfig
      Release-Production: Config/Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sora.TabiSplit.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.1"
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # The share extension has its own bundle id; the xcconfig sets the app's
        # entitlements/bundle id, which the base settings above override.
  Tabi Split Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: "Tabi Split Tests"
        excludes: ["Fixtures"]
      # Previous-release SwiftData stores opened by StoreMigrationTests. Folder
      # reference so the whole tree is copied into the test bundle as-is.
      - path: "Tabi Split Tests/Fixtures"
        type: folder
    dependencies:
      - target: "Tabi Split"
    settings:
      base:
        # Same floor as the app so tests run on any simulator ≥ 18.1 (without this
        # the test bundle defaults to the SDK version and only the newest runtime works).
        IPHONEOS_DEPLOYMENT_TARGET: "18.1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tabi Split.app/Tabi Split"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Tabi Split (Dev):
    build:
      targets:
        Tabi Split: all
        Tabi Split Tests: all
        ShareExtension: all
    run:
      config: Debug-Dev
      executable: Tabi Split
    test:
      config: Debug-Dev
      targets:
        - name: "Tabi Split Tests"
      gatherCoverageData: true
    profile:
      config: Release-Dev
      executable: Tabi Split
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  Tabi Split (Staging):
    build:
      targets:
        Tabi Split: all
        Tabi Split Tests: all
        ShareExtension: all
    run:
      config: Debug-Staging
      executable: Tabi Split
    test:
      config: Debug-Staging
      targets:
        - name: "Tabi Split Tests"
      gatherCoverageData: true
    profile:
      config: Release-Staging
      executable: Tabi Split
    analyze:
      config: Debug-Staging
    archive:
      config: Release-Staging
  Tabi Split (Production):
    build:
      targets:
        Tabi Split: all
        Tabi Split Tests: all
        ShareExtension: all
    run:
      config: Debug-Production
      executable: Tabi Split
    test:
      config: Debug-Production
      targets:
        - name: "Tabi Split Tests"
      gatherCoverageData: true
    profile:
      config: Release-Production
      executable: Tabi Split
    analyze:
      config: Debug-Production
    archive:
      config: Release-Production
